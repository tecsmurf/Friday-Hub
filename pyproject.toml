[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-hub"
version = "0.1.0"
description = "Local-first AI orchestration CLI for routing tasks across coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Friday Hub contributors" }
]
keywords = ["ai", "agents", "cli", "ollama", "codex", "claude", "openclaw"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "chromadb>=0.5.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
google = [
  "google-auth>=2.20.0",
  "google-auth-oauthlib>=1.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "google-auth>=2.20.0",
  "google-auth-oauthlib>=1.0.0",
]

[project.scripts]
friday = "friday.cli:main"

[tool.setuptools.packages.find]
include = ["friday*"]

[tool.setuptools.package-data]
friday = ["defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# B008: typer.Option/Argument in defaults is Typer's documented idiom.
# B905: zip() over lists built from the same keys.
ignore = ["E501", "B008", "B905"]
