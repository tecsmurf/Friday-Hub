# Friday Hub v2 - Default Configuration

models:
  primary_provider: ollama
  fallback_provider: openrouter

  brain:
    ollama: ${OLLAMA_BRAIN_MODEL:-qwen3:4b}
    openrouter: ${OPENROUTER_BRAIN_MODEL:-qwen/qwen-2.5-72b-instruct}
    temperature: 0.3
    max_tokens: 4096

  fast:
    ollama: ${OLLAMA_FAST_MODEL:-qwen2.5-coder:3b}
    openrouter: ${OPENROUTER_FAST_MODEL:-qwen/qwen-2.5-coder-32b-instruct}
    temperature: 0.2
    max_tokens: 2048

agents:
  claude-code:
    name: Claude Code
    command: ${CLAUDE_CODE_CMD:-claude}
    enabled: true
    priority: 1
    capabilities:
      - code-refactoring
      - multi-file-edit
      - deep-understanding
      - debugging
      - architecture
    # Prompt is sent on stdin (no {prompt} placeholder): no length limit and
    # no cmd.exe quoting issues on Windows. In -p mode Claude Code only uses
    # tools you pre-approve; add e.g. "--permission-mode", "acceptEdits"
    # here to let it edit files.
    execute_args: ["-p"]
    version_args: ["--version"]
    health_args: ["--help"]
    timeout: 600

  codex:
    name: Codex CLI
    command: ${CODEX_CMD:-codex}
    enabled: true
    priority: 2
    capabilities:
      - fast-coding
      - test-generation
      - routine-tasks
      - sandboxed-execution
    # `codex exec` is the non-interactive mode; "-" reads the prompt from stdin.
    execute_args: ["exec", "-"]
    version_args: ["--version"]
    health_args: ["exec", "--help"]
    timeout: 600

  openclaw:
    name: OpenClaw
    command: ${OPENCLAW_CMD:-openclaw}
    enabled: true
    priority: 3
    capabilities:
      - multi-platform
      - automation
      - messaging
      - tool-heavy
      - web-automation
    # Runs one turn on the default "main" agent via the OpenClaw Gateway.
    execute_args: ["agent", "--agent", "main", "--message-file", "{prompt_file}"]
    version_args: ["--version"]
    health_args: ["agent", "--help"]
    timeout: 600

router:
  default_agent: claude-code
  fallbacks:
    claude-code: [codex, openclaw]
    codex: [claude-code, openclaw]
    openclaw: [claude-code, codex]

memory:
  short_term:
    max_entries: 50
    ttl_seconds: 3600
  long_term:
    db_path: ./data/memory
    collection_name: friday_memory
    max_results: 5
  logs:
    directory: ./data/logs
    max_files: 200

health:
  smoke_test_timeout: 15
  version_lock_path: ./data/versions.lock.json

assistant:
  db_path: ./data/assistant.db
  default_duration_minutes: 30   # appointment length when none is given
  remind_before_minutes: 15      # reminder lead time for appointments
  workday_start: "09:00"         # used when looking for free slots
  workday_end: "18:00"
  google_calendar:
    enabled: true                # sync once `friday calendar connect` has been run
    calendar_id: primary         # or a specific calendar's ID

learning:
  enabled: true
  auto_evaluate: true
  min_feedback_for_learning: 5
