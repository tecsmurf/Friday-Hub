name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium for Playwright (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium for Playwright (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Lint
        run: ruff check friday tests
      - name: Test
        env:
          FRIDAY_REQUIRE_BROWSER: "1"  # browser tests must run, not skip
        run: pytest -q
      - name: CLI smoke test
        run: |
          friday --help
          friday config
          friday history
          friday web --help
          friday web status
          friday web routine list

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check packaged default config is included
        run: python -m zipfile -l dist/*.whl | grep friday/defaults/friday.yaml
